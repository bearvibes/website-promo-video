name: RenderGames76 Cloud Render

on:
  workflow_dispatch: # Manual 1-click trigger button in GitHub UI
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  render-games-76:
    name: 🕹️ RenderGames76 Free Cloud Render (1.2x Speed)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: promo-video/package-lock.json

      - name: Install Dependencies
        run: |
          cd promo-video
          npm ci

      - name: Run RenderGames76 Cloud Engine (1.2x Speed)
        run: |
          cd promo-video
          npm run render:games76

      - name: Write GitHub Step Summary
        if: always()
        run: |
          echo "# 🕹️ RenderGames76 Cloud Render Completed (1.2x Speed)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value | Reference |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ Completed | 100% |" >> $GITHUB_STEP_SUMMARY
          echo "| **Output Resolution** | 1920x1080 | 1080p Full HD |" >> $GITHUB_STEP_SUMMARY
          echo "| **Speed Multiplier** | 36 FPS | **1.2x Speed** vs 30 FPS Reference |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Frames** | 2,775 frames | Full Length |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Rendered MP4 Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video_1.2x.mp4
          path: promo-video/out/video_1.2x.mp4

      - name: Publish Direct Video Download Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: RenderGames76 Latest Video (1.2x Speed)
          files: promo-video/out/video_1.2x.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
